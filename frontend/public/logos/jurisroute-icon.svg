<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80"
     role="img" aria-label="JurisRoute">
  <defs>
    <linearGradient id="jr-road" x1="32" y1="76" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="jr-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jr-glow-sm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        line, circle, path { opacity: 1 !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

  <!-- ── ROAD ── -->
  <line x1="5" y1="76" x2="32" y2="40"
        stroke="url(#jr-road)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="45" stroke-dashoffset="45" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="45" to="0" dur="0.7s" begin="0.1s" fill="freeze"
             calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>
  <line x1="59" y1="76" x2="32" y2="40"
        stroke="url(#jr-road)" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="45" stroke-dashoffset="45" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.1s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="45" to="0" dur="0.7s" begin="0.1s" fill="freeze"
             calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>

  <!-- Center dashes -->
  <line x1="32" y1="70" x2="32" y2="44"
        stroke="#334155" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="3 4" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="0.65s" fill="freeze"/>
  </line>

  <!-- ── CIRCUIT NODES – LEFT ── -->
  <circle cx="10" cy="69" r="2.5" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.45s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="62" r="2.5" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.55s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="21" cy="54" r="2.5" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.65s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="27" cy="47" r="2.5" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.75s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.9s" repeatCount="indefinite"/>
  </circle>

  <!-- ── CIRCUIT NODES – RIGHT ── -->
  <circle cx="54" cy="69" r="2.5" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.45s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="62" r="2.5" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.55s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.45s" repeatCount="indefinite"/>
  </circle>
  <circle cx="43" cy="54" r="2.5" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.65s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="3.75s" repeatCount="indefinite"/>
  </circle>
  <circle cx="37" cy="47" r="2.5" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.75s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="4.05s" repeatCount="indefinite"/>
  </circle>

  <!-- Convergence junction -->
  <circle cx="32" cy="40" r="3" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.82s" fill="freeze"/>
    <animate attributeName="r" values="3;3.8;3" dur="2s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ── SCALE POLE ── -->
  <line x1="32" y1="40" x2="32" y2="12"
        stroke="#16A34A" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="28" stroke-dashoffset="28" opacity="0"
        filter="url(#jr-glow-sm)">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.9s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.4s" begin="0.9s" fill="freeze"
             calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </line>

  <!-- Pole tip -->
  <circle cx="32" cy="12" r="2" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.25s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" begin="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Pivot dot -->
  <circle cx="32" cy="18" r="2.5" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.2s" fill="freeze"/>
  </circle>

  <!-- ── SCALE BEAM – left half ── -->
  <line x1="32" y1="18" x2="32" y2="18"
        stroke="#16A34A" stroke-width="2" stroke-linecap="round"
        filter="url(#jr-glow-sm)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.25s" fill="freeze"/>
    <animate attributeName="x1" from="32" to="12" dur="0.3s" begin="1.25s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Scale beam – right half -->
  <line x1="32" y1="18" x2="32" y2="18"
        stroke="#14B8A6" stroke-width="2" stroke-linecap="round"
        filter="url(#jr-glow-sm)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.25s" fill="freeze"/>
    <animate attributeName="x2" from="32" to="52" dur="0.3s" begin="1.25s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- Beam endpoint dots -->
  <circle cx="12" cy="18" r="2" fill="#16A34A" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.55s" fill="freeze"/>
  </circle>
  <circle cx="52" cy="18" r="2" fill="#14B8A6" filter="url(#jr-glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.55s" fill="freeze"/>
  </circle>

  <!-- ── STRINGS ── -->
  <line x1="12" y1="18" x2="10" y2="28"
        stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="11" stroke-dashoffset="11" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.6s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.25s" begin="1.6s" fill="freeze"/>
  </line>
  <line x1="52" y1="18" x2="54" y2="28"
        stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="11" stroke-dashoffset="11" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.6s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="11" to="0" dur="0.25s" begin="1.6s" fill="freeze"/>
  </line>

  <!-- ── SCALE PANS ── -->
  <path d="M 7,28 Q 10,33 13,28"
        fill="none" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="8" stroke-dashoffset="8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.8s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.2s" begin="1.8s" fill="freeze"/>
  </path>
  <path d="M 51,28 Q 54,33 57,28"
        fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"
        stroke-dasharray="8" stroke-dashoffset="8" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.8s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="8" to="0" dur="0.2s" begin="1.8s" fill="freeze"/>
  </path>

  <!-- Pan corner dots -->
  <circle cx="7"  cy="28" r="1.5" fill="#16A34A" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.85s" fill="freeze"/>
  </circle>
  <circle cx="13" cy="28" r="1.5" fill="#16A34A" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.85s" fill="freeze"/>
  </circle>
  <circle cx="51" cy="28" r="1.5" fill="#14B8A6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.85s" fill="freeze"/>
  </circle>
  <circle cx="57" cy="28" r="1.5" fill="#14B8A6" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.85s" fill="freeze"/>
  </circle>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="JurisRoute">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>

  <!-- Road V-shape (white, bold) -->
  <line x1="3" y1="28" x2="16" y2="16" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="29" y1="28" x2="16" y2="16" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Circuit nodes on road -->
  <circle cx="6"  cy="25" r="1.5" fill="#16A34A"/>
  <circle cx="26" cy="25" r="1.5" fill="#16A34A"/>
  <circle cx="10" cy="21" r="1.5" fill="#14B8A6"/>
  <circle cx="22" cy="21" r="1.5" fill="#14B8A6"/>

  <!-- Convergence dot -->
  <circle cx="16" cy="16" r="2" fill="#14B8A6"/>

  <!-- Scale pole -->
  <line x1="16" y1="16" x2="16" y2="6" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Scale beam -->
  <line x1="9" y1="10" x2="23" y2="10" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Beam dots -->
  <circle cx="9"  cy="10" r="1.5" fill="#16A34A"/>
  <circle cx="23" cy="10" r="1.5" fill="#14B8A6"/>
  <circle cx="16" cy="10" r="1.5" fill="#16A34A"/>

  <!-- Strings -->
  <line x1="9"  y1="10" x2="8"  y2="15" stroke="#16A34A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="10" x2="24" y2="15" stroke="#14B8A6" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Pans -->
  <path d="M 6,15 Q 8,17 10,15" fill="none" stroke="#16A34A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 22,15 Q 24,17 26,15" fill="none" stroke="#14B8A6" stroke-width="1.2" stroke-linecap="round"/>
</svg>

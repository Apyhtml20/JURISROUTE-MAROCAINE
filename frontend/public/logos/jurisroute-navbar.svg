<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44"
     role="img" aria-label="JurisRoute">
  <defs>
    <linearGradient id="nb-road" x1="16" y1="38" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="nb-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        line, circle, path, g { opacity: 1 !important; stroke-dashoffset: 0 !important; }
      }
      @media (prefers-color-scheme: dark) {
        .nb-primary { fill: #F1F5F9; }
        .nb-secondary { fill: #94A3B8; }
      }
    </style>
  </defs>

  <!-- ══ ICON scaled to ~32px tall, centered in 44px height ══ -->
  <!-- Icon uses 64×80 coordinate space scaled by 0.45 → 28.8×36 -->
  <g transform="translate(4, 4) scale(0.45)">

    <!-- Road -->
    <line x1="5" y1="76" x2="32" y2="40"
          stroke="url(#nb-road)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="45" stroke-dashoffset="45" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.1s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="45" to="0" dur="0.45s" begin="0.1s" fill="freeze"/>
    </line>
    <line x1="59" y1="76" x2="32" y2="40"
          stroke="url(#nb-road)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="45" stroke-dashoffset="45" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.1s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="45" to="0" dur="0.45s" begin="0.1s" fill="freeze"/>
    </line>

    <!-- Nodes (simplified: 2 per side) -->
    <circle cx="13" cy="65" r="3.5" fill="#16A34A" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="52" r="3.5" fill="#14B8A6" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="51" cy="65" r="3.5" fill="#16A34A" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="52" r="3.5" fill="#14B8A6" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Convergence -->
    <circle cx="32" cy="40" r="4" fill="#14B8A6" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.55s" fill="freeze"/>
    </circle>

    <!-- Scale pole -->
    <line x1="32" y1="40" x2="32" y2="12" stroke="#16A34A" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="28" stroke-dashoffset="28" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.6s" fill="freeze"/>
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.3s" begin="0.6s" fill="freeze"/>
    </line>
    <circle cx="32" cy="18" r="3" fill="#16A34A" filter="url(#nb-glow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0.85s" fill="freeze"/>
    </circle>

    <!-- Beam -->
    <line x1="32" y1="18" x2="32" y2="18" stroke="#16A34A" stroke-width="2.5"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.88s" fill="freeze"/>
      <animate attributeName="x1" from="32" to="12" dur="0.25s" begin="0.88s" fill="freeze"/>
    </line>
    <line x1="32" y1="18" x2="32" y2="18" stroke="#14B8A6" stroke-width="2.5"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.88s" fill="freeze"/>
      <animate attributeName="x2" from="32" to="52" dur="0.25s" begin="0.88s" fill="freeze"/>
    </line>

    <!-- Strings + pans -->
    <line x1="12" y1="18" x2="10" y2="28" stroke="#16A34A" stroke-width="2"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.1s" fill="freeze"/>
    </line>
    <line x1="52" y1="18" x2="54" y2="28" stroke="#14B8A6" stroke-width="2"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.1s" fill="freeze"/>
    </line>
    <path d="M 7,28 Q 10,33 13,28" fill="none" stroke="#16A34A" stroke-width="2"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.2s" fill="freeze"/>
    </path>
    <path d="M 51,28 Q 54,33 57,28" fill="none" stroke="#14B8A6" stroke-width="2"
          stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="1.2s" fill="freeze"/>
    </path>
  </g>

  <!-- ══ WORDMARK ══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
    <text font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="22" letter-spacing="0.5">
      <tspan x="44" y="28" font-weight="800" class="nb-primary" fill="#0F172A">JURIS</tspan><tspan
             font-weight="300" class="nb-secondary" fill="#475569">ROUTE</tspan>
    </text>
  </g>
</svg>
